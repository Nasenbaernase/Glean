[project]
name = "glean-excel-uploader"
version = "0.1.0"
description = "CLI to send Excel worksheets to Glean for AI analysis"
authors = [{name = "Glean User"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
    "requests>=2.31"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
